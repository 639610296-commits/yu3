<script>
function fireDanmu(){
  const textList = [
    "空怀少年凌云志，不如打头认准并存。",
    "纵饮山河千盏酒，不如打头认准并存。",
    "剑扫江湖三十州，不如打头认准并存。",
    "枉负人间风流名，不如打头认准并存。",
    "纵使名扬千万里，不如打头认准并存。",
    "徒拥胸中鸿鹄梦，不如打头认准并存。",
    "阅尽世间豪杰客，不如打头认准并存。",
    "漫道男儿冲天志，不如打头认准并存。"
  ];

  const colorList = [
    "#ff4d8d",
    "#ffaa00",
    "#ffe135",
    "#4fd1ff",
    "#b27cff",
    "#ff7ac6",
    "#ffd166",
    "#7cff7c"
  ];

  //生成50条，随机位置弹出，原地渐隐，不横向移动
  for(let i=0;i<50;i++){
    setTimeout(()=>{
      const div = document.createElement('div');
      div.innerText = textList[Math.floor(Math.random()*textList.length)];
      div.style.position = "fixed";
      //随机屏幕位置
      div.style.left = (Math.random() * 75 + 5)+"%";
      div.style.top = (Math.random() * 75 + 5)+"%";
      div.style.fontSize = "30px";
      div.style.fontWeight = "700";
      div.style.color = colorList[Math.floor(Math.random()*colorList.length)];
      div.style.textShadow = "0 0 4px #000, 1px 1px 4px #000";
      div.style.zIndex = "900";
      div.style.pointerEvents = "none";
      div.style.whiteSpace = "nowrap";
      div.style.letterSpacing = "2px";
      div.style.opacity = 0;
      document.body.appendChild(div);

      let opacity = 0;
      // 淡入 -> 停留7秒让人看清 -> 淡出，全程10秒
      function fadeInOut(){
        if(opacity < 1){
          opacity += 0.02;
          div.style.opacity = opacity;
          requestAnimationFrame(fadeInOut);
        }else{
          setTimeout(()=>{
            function fadeOut(){
              opacity -= 0.015;
              div.style.opacity = opacity;
              if(opacity <= 0){
                div.remove();
              }else{
                requestAnimationFrame(fadeOut);
              }
            }
            fadeOut();
          },7000);
        }
      }
      fadeInOut();
    }, i*220);
  }

  //烟花
  const w = window.innerWidth;
  const h = window.innerHeight;
  createFirework(w * 0.15, h * 0.25);
  createFirework(w * 0.85, h * 0.20);
  createFirework(w * 0.20, h * 0.55);
  createFirework(w * 0.80, h * 0.60);
  createFirework(w * 0.50, h * 0.18);
  createFirework(w * 0.50, h * 0.50);
  createFirework(w * 0.35, h * 0.75);
  createFirework(w * 0.65, h * 0.80);

  setTimeout(()=>{
    createBigFirework(w / 2, h / 2);
  },350);
}

function createFirework(x,y){
  const particleCount = 36;
  const colorList = ["#ff4d8d","#ffaa00","#ffe135","#4fd1ff","#b27cff","#ff7ac6","#ffffff","#7cff7c"];
  for(let i=0;i<particleCount;i++){
    const p = document.createElement('div');
    p.style.position = "fixed";
    p.style.left = x+"px";
    p.style.top = y+"px";
    p.style.width = "11px";
    p.style.height = "11px";
    p.style.borderRadius = "50%";
    p.style.background = colorList[Math.floor(Math.random()*colorList.length)];
    p.style.boxShadow = "0 0 10px currentColor";
    p.style.zIndex = "901";
    p.style.pointerEvents = "none";
    document.body.appendChild(p);

    const angle = (Math.PI*2 / particleCount)*i + Math.random()*0.4;
    const velocity = 5 + Math.random()*6;
    let vx = Math.cos(angle)*velocity;
    let vy = Math.sin(angle)*velocity;
    let life = 70;

    function explode(){
      life--;
      p.style.left = (parseFloat(p.style.left)+vx)+"px";
      p.style.top = (parseFloat(p.style.top)+vy + 0.08)+"px";
      p.style.opacity = life/70;
      if(life>0){
        requestAnimationFrame(explode);
      }else{
        p.remove();
      }
    }
    explode();
  }
}

function createBigFirework(x,y){
  const particleCount = 60;
  const colorList = ["#ff4d8d","#ffaa00","#ffe135","#4fd1ff","#b27cff","#ff7ac6","#ffffff"];
  for(let i=0;i<particleCount;i++){
    const p = document.createElement('div');
    p.style.position = "fixed";
    p.style.left = x+"px";
    p.style.top = y+"px";
    p.style.width = "14px";
    p.style.height = "14px";
    p.style.borderRadius = "50%";
    p.style.background = colorList[Math.floor(Math.random()*colorList.length)];
    p.style.boxShadow = "0 0 14px currentColor";
    p.style.zIndex = "902";
    p.style.pointerEvents = "none";
    document.body.appendChild(p);

    const angle = (Math.PI*2 / particleCount)*i;
    const velocity = 7 + Math.random()*7;
    let vx = Math.cos(angle)*velocity;
    let vy = Math.sin(angle)*velocity;
    let life = 80;

    function explode(){
      life--;
      p.style.left = (parseFloat(p.style.left)+vx)+"px";
      p.style.top = (parseFloat(p.style.top)+vy + 0.09)+"px";
      p.style.opacity = life/80;
      if(life>0){
        requestAnimationFrame(explode);
      }else{
        p.remove();
      }
    }
    explode();
  }
}
</script>
