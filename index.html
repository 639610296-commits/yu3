<style>
/* =========================
   全局
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
    linear-gradient(180deg,#f8fbff 0%,#eef4ff 40%,#edf3ff 100%);
    color:#222;
    padding:14px;
    min-height:100vh;
    overflow-x:hidden;
}

.container{
    max-width:720px;
    margin:0 auto;
}

/* =========================
   Banner
========================= */

.banner{
    position:relative;
    overflow:hidden;
    border-radius:24px;
    margin-bottom:18px;
    background:#fff;
    box-shadow:
        0 10px 30px rgba(64,95,190,.10),
        0 2px 8px rgba(0,0,0,.05);
}

.banner img{
    width:100%;
    display:block;
    object-fit:cover;
    border-radius:24px;
}

/* Banner 顶部柔光 */

.banner::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:70px;
    background:linear-gradient(
        rgba(255,255,255,.18),
        rgba(255,255,255,0)
    );
    pointer-events:none;
}
/*==========================
  公告
==========================*/

.notice{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    margin-bottom:18px;

    background:rgba(255,255,255,.92);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-radius:20px;
    border:1px solid rgba(255,255,255,.8);

    box-shadow:
        0 8px 24px rgba(68,102,255,.08),
        inset 0 1px 0 rgba(255,255,255,.9);

    overflow:hidden;
}

.notice-title{

    flex-shrink:0;

    width:62px;
    height:34px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:30px;

    background:linear-gradient(135deg,#5d7cff,#8ab9ff);

    color:#fff;

    font-size:13px;

    font-weight:700;

    letter-spacing:1px;

    box-shadow:0 4px 12px rgba(93,124,255,.28);
}

.notice-box{

    flex:1;

    overflow:hidden;

    position:relative;
}

.notice-box::before{

    content:"";

    position:absolute;

    left:0;
    top:0;
    bottom:0;

    width:24px;

    background:linear-gradient(to right,#fff,rgba(255,255,255,0));

    z-index:2;
}

.notice-box::after{

    content:"";

    position:absolute;

    right:0;
    top:0;
    bottom:0;

    width:24px;

    background:linear-gradient(to left,#fff,rgba(255,255,255,0));

    z-index:2;
}

.notice-list{

    display:flex;

    width:max-content;

    white-space:nowrap;

    animation:noticeMove 24s linear infinite;
}

.notice-list div{

    padding-right:120px;

    color:#555;

    font-size:14px;

    font-weight:500;

    line-height:22px;
}

@keyframes noticeMove{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-50%);
    }

}
/*==========================
  分区标题
==========================*/

.section-title{

    position:relative;

    display:flex;

    align-items:center;

    font-size:20px;

    font-weight:700;

    color:#2f3542;

    margin:26px 0 16px;

    padding-left:16px;

}

.section-title::before{

    content:"";

    position:absolute;

    left:0;

    width:5px;

    height:24px;

    border-radius:30px;

    background:linear-gradient(180deg,#5b7cff,#87baff);

}

/*==========================
  平台排列
==========================*/

.grid{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:14px;

}

/*==========================
  平台卡片
==========================*/

.card{

    display:block;

    text-decoration:none;

    color:#222;

    background:#ffffff;

    border-radius:22px;

    padding:16px 12px;

    border:1px solid rgba(92,122,255,.08);

    box-shadow:
        0 10px 24px rgba(53,88,188,.08);

    transition:.25s ease;

    overflow:hidden;

    position:relative;

}

.card::before{

    content:"";

    position:absolute;

    left:0;

    right:0;

    top:0;

    height:4px;

    background:linear-gradient(90deg,#5b7cff,#89bcff);

    opacity:0;

    transition:.25s;

}

.card:active{

    transform:scale(.97);

}

@media(hover:hover){

.card:hover{

    transform:translateY(-5px);

    box-shadow:

    0 18px 36px rgba(73,102,215,.15);

}

.card:hover::before{

    opacity:1;

}

}
/*==========================
  平台内容
==========================*/

.card-top{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

}

/*==========================
  平台图标
==========================*/

.card-top img{

    width:72px;

    height:72px;

    display:block;

    object-fit:cover;

    border-radius:22px;

    background:#f7f9ff;

    padding:3px;

    border:1px solid rgba(255,255,255,.95);

    box-shadow:
        0 10px 24px rgba(0,0,0,.10),
        0 3px 10px rgba(90,120,255,.12);

    transition:.30s;

}

/* 点击反馈 */

.card:active .card-top img{

    transform:scale(.95);

}

@media (hover:hover){

.card:hover .card-top img{

    transform:translateY(-3px) scale(1.04);

}

}

/*==========================
  平台名称
==========================*/

.card-info{

    width:100%;

    text-align:center;

    margin-top:12px;

}

.card-info h3{

    font-size:15px;

    font-weight:700;

    color:#2d2d2d;

    line-height:22px;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

}

/*==========================
  按钮
==========================*/

.card-btn{

    margin-top:14px;

    width:100%;

    height:38px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:999px;

    background:linear-gradient(135deg,#5b7cff,#8cc3ff);

    color:#fff;

    font-size:13px;

    font-weight:700;

    letter-spacing:.5px;

    box-shadow:
        0 8px 18px rgba(91,124,255,.22);

    transition:.25s;

}

@media (hover:hover){

.card:hover .card-btn{

    filter:brightness(1.05);

}

}
/*==========================
  Footer
==========================*/

.footer{

    margin:34px 0 16px;

    padding:22px 16px;

    text-align:center;

    background:#fff;

    border-radius:22px;

    border:1px solid rgba(90,120,255,.08);

    box-shadow:
        0 8px 24px rgba(80,110,220,.08);

}

.footer div{

    color:#7d8697;

    font-size:13px;

    line-height:26px;

}

.footer div:first-child{

    color:#4f67ff;

    font-size:16px;

    font-weight:700;

    margin-bottom:6px;

}

/*==========================
  图片优化
==========================*/

img{

    max-width:100%;

    display:block;

    user-select:none;

    -webkit-user-drag:none;

}

/* 平台图片 */

.card img{

    background:#f7f9ff;

}

/* Banner图片 */

.banner img{

    background:#edf3ff;

}

/*==========================
  手机适配
==========================*/

@media screen and (max-width:768px){

.grid{

    grid-template-columns:repeat(3,1fr);

    gap:12px;

}

.card{

    padding:14px 10px;

}

.card-top img{

    width:66px;

    height:66px;

}

.card-btn{

    height:36px;

    font-size:12px;

}

.section-title{

    font-size:18px;

}

}

/*==========================
  小屏手机
==========================*/

@media screen and (max-width:390px){

body{

    padding:10px;

}

.grid{

    gap:10px;

}

.card{

    border-radius:18px;

}

.card-top img{

    width:60px;

    height:60px;

}

.card-info h3{

    font-size:14px;

}

}
