<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
}

body{
    background:#edf5ff;
    padding:15px;
}

.container{
    max-width:700px;
    margin:auto;
}

/* 公告 */

.notice{
    margin-top:15px;
    background:#fff;
    border-radius:14px;
    padding:10px 14px;
    box-shadow:0 5px 15px rgba(0,0,0,.05);
    display:flex;
    align-items:center;
    overflow:hidden;
}

.notice-title{
    font-size:15px;
    font-weight:700;
    color:#3b6ff7;
    white-space:nowrap;
    margin-right:10px;
}

.notice-box{
    flex:1;
    overflow:hidden;
}

.notice-list{
    display:flex;
    width:max-content;
    white-space:nowrap;
    animation:noticeMove 20s linear infinite;
}

.notice-list div{
    font-size:14px;
    color:#555;
    margin-right:80px;
    flex-shrink:0;
}

@keyframes noticeMove{
    0%{
        transform:translateX(100%);
    }

    100%{
        transform:translateX(-100%);
    }
}

/* 联系 */

.contact{
    margin-top:15px;
    background:#fff;
    border-radius:18px;
    padding:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.contact div{
    margin:8px 0;
    font-size:16px;
}

/* 标题 */

.title{
    margin:30px 0 18px;
    text-align:center;
    font-size:28px;
    font-weight:700;
    color:#3b6ff7;
}

/* 卡片区域 */

.grid{
    display:grid;
    grid-template-columns:1fr;
    gap:18px;
    width:100%;
}

/* 卡片 */

.card{
    display:block;
    width:100%;
    background:#fff;
    border-radius:24px;
    padding:18px;
    text-decoration:none;
    color:#222;
    box-shadow:0 10px 24px rgba(0,0,0,.08);
    transition:.30s;
}

.card:hover{
    transform:translateY(-3px);
}

.card-top{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:18px;
}

.card img{
    width:72px;
    height:72px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
}

/* 图片轮播 */

.card-slider{
    position:relative;
    width:100%;
    overflow:hidden;
    border-radius:16px;
    margin-bottom:18px;
}

.card-slider-track{
    display:flex;
    width:300%;
    align-items:flex-start;
    transition:transform .5s ease;
}

.card-slide{
    width:33.333333%;
    flex-shrink:0;
}

.card-slide img{
    display:block;
    width:100%;
    height:auto;
    border-radius:16px;
    object-fit:contain;
}

/* 按钮 */

.card-btn{
    height:50px;
    border-radius:999px;
    background:linear-gradient(90deg,#47c7ff,#1c8cff);
    color:#fff;
    font-size:18px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* 底部 */

.footer{
    text-align:center;
    padding:35px 20px;
    color:#666;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<div class="card-slider">

    <div class="card-slider-track">

        <div class="card-slide">
            <img src="https://i.ibb.co/qMYLGXYq/IMG-0538.jpg">
        </div>

        <div class="card-slide">
            <img src="https://i.ibb.co/N648H7zW/5-B05-E374-5224-43-B8-8-BF2-E0-B54-B52-AD17.png">
        </div>

        <div class="card-slide">
            <img src="https://i.ibb.co/PGbH4pQv/611-E2-F5-B-87-F3-4-AA1-B22-C-37-F7-C72-FEF59.png">
        </div>

    </div>

</div>

<script>

/* 图片左右滑动轮播 */

document.querySelectorAll(".card-slider").forEach(function(slider){

    const track = slider.querySelector(".card-slider-track");
    const slides = slider.querySelectorAll(".card-slide");

    let index = 0;
    let startX = 0;
    let startY = 0;

    function showSlide(){
        track.style.transform =
            "translateX(-" + (index * 33.333333) + "%)";
    }

    /* 自动轮播 */

    setInterval(function(){

        index++;

        if(index >= slides.length){
            index = 0;
        }

        showSlide();

    },3000);

    /* 手机左右滑动 */

    slider.addEventListener("touchstart",function(e){

        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;

    });

    slider.addEventListener("touchend",function(e){

        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;

        const moveX = endX - startX;
        const moveY = endY - startY;

        if(Math.abs(moveX) > 50 && Math.abs(moveX) > Math.abs(moveY)){

            if(moveX < 0){
                index++;
            }else{
                index--;
            }

            if(index >= slides.length){
                index = 0;
            }

            if(index < 0){
                index = slides.length - 1;
            }

            showSlide();

        }

    });

});

</script>

</body>
