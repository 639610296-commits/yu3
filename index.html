<script>
function fireDanmu(){
  const textList = [
    "莫羡他人凌云志，不如打头认准并存",
    "休夸别家千种好，不如打头认准并存",
    "纵慕江湖豪杰客，不如打头认准并存",
    "空羡世间名与势，不如打头认准并存",
    "休道旁人多意气，不如打头认准并存",
    "莫逐人间浮华梦，不如打头认准并存",
    "徒羡他乡风光好，不如打头认准并存",
    "漫说别家声势盛，不如打头认准并存"
  ];

  const colorList = ["#ff4d8d","#ffaa00","#ffe135","#4fd1ff","#b27cff","#ff7ac6","#ffd166","#7cff7c"];

  for(let i = 0; i < 20; i++){
    setTimeout(()=>{
      const div = document.createElement('div');
      div.innerText = textList[Math.floor(Math.random() * textList.length)];
      div.style.position = "fixed";
      div.style.left = (Math.random() * 70 + 5)+"%";
      div.style.top = "-60px";
      div.style.fontSize = "14px";
      div.style.fontWeight = "700";
      div.style.color = colorList[Math.floor(Math.random() * colorList.length)];
      div.style.textShadow = "1px 1px 3px #000";
      div.style.zIndex = "900";
      div.style.pointerEvents = "none";
      div.style.whiteSpace = "nowrap";
      div.style.maxWidth = "90vw";
      div.style.opacity = "1";
      document.body.appendChild(div);

      const speedY = 0.8 + Math.random() * 0.7;
      let topVal = -60;
      let fading = false;

      function dropLoop(){
        topVal += speedY;
        div.style.top = topVal + "px";

        if(topVal > window.innerHeight * 0.72 && !fading){
          fading = true;
        }
        if(fading){
          div.style.opacity -= 0.006;
        }

        if(topVal > window.innerHeight + 40 || parseFloat(div.style.opacity) <= 0){
          div.remove();
          return;
        }
        requestAnimationFrame(dropLoop);
      }
      dropLoop();
    }, i * 320);
  }

  const w = window.innerWidth;
  const h = window.innerHeight;
  const positions = [
    { x:w*0.18,y:h*0.22 },
    { x:w*0.82,y:h*0.18 },
    { x:w*0.22,y:h*0.48 },
    { x:w*0.78,y:h*0.52 },
    { x:w*0.5,y:h*0.24 },
    { x:w*0.36,y:h*0.7 },
    { x:w*0.64,y:h*0.74 }
  ];
  positions.forEach((pos,idx)=>{
    setTimeout(()=>{ niceFirework(pos.x,pos.y); }, idx*380);
  });
  setTimeout(()=>{ niceFirework(w/2, h/2,1.4); },900);
}

function niceFirework(x,y,scale=1){
  const colorList = [
    ["#ff4d8d","#ff7ac6","#ffffff"],
    ["#ffaa00","#ffe135","#ffffff"],
    ["#4fd1ff","#b27cff","#ffffff"],
    ["#7cff7c","#ffe135","#ffffff"],
    ["#ff7ac6","#b27cff","#4fd1ff"]
  ];
  const colors = colorList[Math.floor(Math.random()*colorList.length)];
  const particleCount = Math.floor(55+Math.random()*35);

  for(let i=0;i<particleCount;i++){
    const p = document.createElement('div');
    p.style.position = "fixed";
    p.style.left = x+"px";
    p.style.top = y+"px";
    p.style.borderRadius = "50%";
    p.style.zIndex = "901";
    p.style.pointerEvents = "none";
    const size = 2 + Math.random()*5;
    p.style.width = size+"px";
    p.style.height = size+"px";
    const color = colors[Math.floor(Math.random()*colors.length)];
    p.style.background = color;
    p.style.boxShadow = "0 0 8px "+color;

    const angle = (Math.PI*2/particleCount)*i + Math.random()*0.6;
    const velocity = (4 + Math.random()*5)*scale;
    let vx = Math.cos(angle)*velocity;
    let vy = Math.sin(angle)*velocity;
    const trail = 0.88 + Math.random()*0.08;
    let life = 75 + Math.random()*25;
    if(Math.random()<0.12){
      p.style.width = (size+3)+"px";
      p.style.height = (size+3)+"px";
      p.style.boxShadow = "0 0 14px "+color;
    }
    document.body.appendChild(p);
    function explode(){
      life--;
      vx *= trail;
      vy *= trail;
      vy +=0.04;
      p.style.left = (parseFloat(p.style.left)+vx)+"px";
      p.style.top = (parseFloat(p.style.top)+vy)+"px";
      p.style.opacity = Math.max(0, life/100);
      if(life>0){
        requestAnimationFrame(explode);
      }else{
        p.remove();
      }
    }
    explode();
  }
  const flash = document.createElement('div');
  flash.style.position="fixed";
  flash.style.left=(x-30*scale)+"px";
  flash.style.top=(y-30*scale)+"px";
  flash.style.width=(60*scale)+"px";
  flash.style.height=(60*scale)+"px";
  flash.style.borderRadius="50%";
  flash.style.background="radial-gradient(circle, rgba(255,255,255,.9), rgba(255,200,80,.4), transparent 70%)";
  flash.style.opacity="1";
  flash.style.zIndex="902";
  flash.style.pointerEvents="none";
  document.body.appendChild(flash);
  let flashOpacity=1;
  function fadeFlash(){
    flashOpacity -=0.08;
    flash.style.opacity=flashOpacity;
    if(flashOpacity>0){
      requestAnimationFrame(fadeFlash);
    }else{
      flash.remove();
    }
  }
  fadeFlash();
}
</script>
