<style>

*{

}

body{

    padding:15px;

.container{
    max-width:700px;
    margin:auto;
}

/* 公告 */

.notice{
    margin-top:15px;
    background:#fff;
    border-radius:14px;
    padding:10px 14px;
    box-shadow:0 5px 15px rgba(0,0,0,.05);
    display:flex;
    align-items:center;
    overflow:hidden;
}

.notice-title{
    font-size:15px;
    font-weight:700;
    color:#3b6ff7;
    white-space:nowrap;
    margin-right:10px;
}

.notice-box{
    flex:1;
    overflow:hidden;
}

.notice-list{
    display:flex;
    width:max-content;
    white-space:nowrap;
    animation:noticeMove 20s linear infinite;
}

.notice-list div{
    font-size:14px;
    color:#555;
    margin-right:80px;
    flex-shrink:0;
}

@keyframes noticeMove{
    0%{
        transform:translateX(100%);
    }

    100%{
        transform:translateX(-100%);
    }
}

/* 联系 */

.contact{
    margin-top:15px;
    background:#fff;
    border-radius:18px;
    padding:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.contact div{
    margin:8px 0;
    font-size:16px;
}

/* 标题 */

.title{
    margin:30px 0 18px;
    text-align:center;
    font-size:28px;
    font-weight:700;
    color:#3b6ff7;
}

/* 卡片区域 */

.grid{
    display:grid;
    grid-template-columns:1fr;
    gap:18px;
    width:100%;
}

/* 卡片 */

.card{
    display:block;
    width:100%;
    background:#fff;
    border-radius:24px;
    padding:18px;
    text-decoration:none;
    color:#222;
    box-shadow:0 10px 24px rgba(0,0,0,.08);
    transition:.25s;
}

.card:hover{
    transform:translateY(-3px);
}

.card-top{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:18px;
}

.card img{
    width:72px;
    height:72px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
}

.card-info{
    flex:1;
    min-width:0;
}

.card-info h3{
    font-size:24px;
    color:#e53935;
    margin:0;
    font-weight:700;
}

.card-info p{
    margin-top:8px;
    font-size:15px;
    color:#777;
}

/* 按钮 */

.card-btn{
    height:50px;
    border-radius:999px;
    background:linear-gradient(90deg,#47c7ff,#1c8cff);
    color:#fff;
    font-size:18px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* 底部 */

.footer{
    text-align:center;
    padding:35px 20px;
    color:#666;
    font-size:14px;
}

</style>

</head>
