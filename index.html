body{

.container{

/* Banner */

.banner{
    border-radius:18px;
    overflow:hidden;

    box-shadow:0 6px 20px rgba(0,0,0,.08);
}

.banner img{
    width:100%;

    object-fit:cover;
}

/* 公告 */

.notice{
    display:flex;
    align-items:center;
    background:#fff;
    padding:12px;
    border-radius:16px;
    margin-bottom:14px;
    box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.notice-title{
    color:#4d67ff;
    font-weight:bold;
    margin-right:10px;
}

.notice-box{
    flex:1;
    overflow:hidden;
}

.notice-list{
    display:flex;
    white-space:nowrap;
    width:max-content;
    animation:noticeMove 18s linear infinite;
}

.notice-list div{
    color:#666;
    margin-right:60px;
    font-size:14px;
}

@keyframes noticeMove{

0%{
transform:translateX(100%);
}

100%{
transform:translateX(-100%);
}

}

/* 联系方式 */

.contact{
    background:#fff;
    padding:14px;
    border-radius:16px;
    margin-bottom:20px;

}

.title{

    margin:20px 0 16px;
}
/* 官方直营（三列） */

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:12px;
}

/* 手机仍然保持三列 */

@media(max-width:768px){

.grid{
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

}

/* 平台卡片 */

.card{

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    background:#fff;

    border-radius:16px;

    padding:12px 8px;

    box-shadow:0 4px 12px rgba(0,0,0,.05);

    transition:.25s;

}

.card:hover{

    transform:translateY(-3px);

}

/* 图标 */

.card img{

    width:56px;

    height:56px;

    border-radius:16px;

    object-fit:cover;

    display:block;

    margin-bottom:8px;

    background:#fff;

    border:1px solid #eef2ff;

    box-shadow:0 3px 8px rgba(0,0,0,.08);

}

/* 平台名称 */

.card-info{

    text-align:center;

}

.card-info h3{

    font-size:14px;

    font-weight:600;

    color:#222;

    margin:0;

}

/* 去掉简介 */

.card-info p{

    display:none;

}

/* 按钮 */

.card-btn{

    width:100%;

    height:30px;

    margin-top:8px;

    border-radius:999px;

    background:linear-gradient(90deg,#4f6bff,#6f56ff);

    color:#fff;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:12px;

    font-weight:600;

}

/* 去掉热门标签 */

.tag{

    display:none;

}

/* 底部 */

.footer{

    margin-top:30px;

    text-align:center;

    color:#999;

    font-size:13px;

    padding:20px 0;

}
</style>
